$kind: http-request
name: update product
method: PUT
url: 'http://127.0.0.1:8000/api/products/:id/'
order: 3000
headers:
  - key: Content-Type
    value: application/json
pathVariables:
  - key: id
    value: '1'
body:
  type: json
  content: |-
    {
      "name": "Updated Product",
      "description": "Updated product description",
      "price": "19.99",
      "stock": 50
    }
